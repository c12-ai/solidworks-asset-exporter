name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - name: Build production add-in
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build-addin.ps1 -Configuration Release
      - name: Create install package
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\new-release-package.ps1 -Version "${{ github.ref_name }}"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: powershell
        run: gh release create "${{ github.ref_name }}" .\artifacts\SolidWorksAssetExporter-${{ github.ref_name }}.zip --generate-notes
